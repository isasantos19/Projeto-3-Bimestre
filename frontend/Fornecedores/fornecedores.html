<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Fornecedores</title>
    <link rel="stylesheet" href="fornecedores.css">
</head>

<body onload="inicializar()">

    <header>
        <h1>Cadastro de Fornecedores</h1>
        <p>Gerencie os fornecedores cadastrados no sistema.</p>
    </header>

    <nav>
        <a href="../Menu/menu.html">Menu</a>
        <a href="../Produtos/produtos.html">Produtos</a>
        <a href="../Categorias/categoria.html">Categorias</a>
        <a href="../Fornecedores/fornecedores.html">Fornecedores</a>
        <a href="../Clientes/clientes.html">Clientes</a>
        <a href="../Estoque/estoque.html">Estoque</a>
    </nav>

    <main class="container-master">

        <div class="conteudo-principal">

            <section class="form-esquerda">

                <h2>Dados do Fornecedor</h2>

                <label for="inputId_fornecedor">ID do Fornecedor</label>
                <div class="linha-id">
                    <input type="text" name="inputId_fornecedor" id="inputId_fornecedor" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputnome_fornecedor">Nome do Fornecedor:</label>
                <input type="text" name="inputnome_fornecedor" id="inputnome_fornecedor">

                <label for="inputcnpj_fornecedor">CNPJ:</label>
                <input type="text" name="inputcnpj_fornecedor" id="inputcnpj_fornecedor" placeholder="Ex: 00000000000000">

                <label for="inputtelefone_fornecedor">Telefone:</label>
                <input type="text" name="inputtelefone_fornecedor" id="inputtelefone_fornecedor" placeholder="Ex: 44999999999">

                <label for="inputemail_fornecedor">E-mail:</label>
                <input type="email" name="inputemail_fornecedor" id="inputemail_fornecedor">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>

            </section>

            <section class="lista-fornecedor">

                <h3>Fornecedores Cadastrados</h3>

                <div id="outputSaida">
                    Carregando...
                </div>

            </section>

        </div>

    </main>

    <footer>
        <p>Isabela Maria Ferreira dos Santos | Turma M32 | 2026</p>
    </footer>

    <script src="./fornecedores.js"></script>

</body>
</html>
