<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Estoque</title>
    <link rel="stylesheet" href="estoque.css">
</head>

<body onload="inicializar()">

    <header>
        <h1>Cadastro de Estoque</h1>
        <p>Gerencie o estoque dos produtos do mercado.</p>
    </header>

    <nav>
        <a href="../Menu/menu.html">Menu</a>
        <a href="../Produtos/produtos.html">Produtos</a>
        <a href="../Categorias/categoria.html">Categorias</a>
        <a href="../Fornecedores/fornecedores.html">Fornecedores</a>
        <a href="../Clientes/clientes.html">Clientes</a>
        <a href="../Estoque/estoque.html">Estoque</a>
    </nav>

    <main class="container-master">

        <div class="conteudo-principal">

            <section class="form-esquerda">

                <h2>Dados do Estoque</h2>

                <label for="inputId_estoque">ID do Estoque</label>
                <div class="linha-id">
                    <input type="text" name="inputId_estoque" id="inputId_estoque" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputquantidade_estoque">Quantidade em Estoque:</label>
                <input type="number" name="inputquantidade_estoque" id="inputquantidade_estoque">

                <label for="inputestoque_minimo">Estoque Mínimo:</label>
                <input type="number" name="inputestoque_minimo" id="inputestoque_minimo">

                <label for="inputdata_atualizacao">Data de Atualização:</label>
                <input type="date" name="inputdata_atualizacao" id="inputdata_atualizacao">

                <label for="inputId_produto">Produto:</label>
                <select name="inputId_produto" id="inputId_produto">
                    <option value="">Selecione um produto</option>
                </select>

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>

            </section>

            <section class="lista-estoque">

                <h3>Estoques Cadastrados</h3>

                <div id="outputSaida">
                    Carregando...
                </div>

            </section>

        </div>

    </main>

    <footer>
        <p>Isabela Maria Ferreira dos Santos | Turma M32 | 2026</p>
    </footer>

    <script src="./estoque.js"></script>

</body>
</html>
